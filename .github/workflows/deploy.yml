name: Проверки и деплой

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Kotlin нужен только проверке контента: андроид-задачи в браузере не
      # исполняются, поэтому записанный в JSON вывод — единственный источник
      # вердикта, и он обязан совпадать с настоящим компилятором.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: fwilhe2/setup-kotlin@main
        with:
          version: 2.1.0
      - run: npm run verify:content
      - run: npx ng test --watch=false
      # base-href нужен для GitHub Pages: сайт живёт в подкаталоге репозитория,
      # и без него все ленивые чанки и запросы за контентом уйдут в корень домена.
      - run: npx ng build --base-href /interview-trainer/
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist/interview-trainer/browser

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
