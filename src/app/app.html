<mat-toolbar class="topbar">
  <a routerLink="/decks" class="brand">
    <mat-icon>school</mat-icon>
    <span class="brand-text">Interview&nbsp;Trainer</span>
  </a>

  <button
    mat-button
    type="button"
    class="track-button"
    [matMenuTriggerFor]="trackMenu"
    aria-label="Направление подготовки"
  >
    {{ trackTitles[track()] }}
    <mat-icon iconPositionEnd>expand_more</mat-icon>
  </button>

  <mat-menu #trackMenu="matMenu">
    @for (item of allTracks; track item) {
      <button mat-menu-item type="button" (click)="selectTrack(item)">
        <span class="track-item">
          <span class="track-title">
            {{ trackTitles[item] }}
            @if (item === track()) {
              <mat-icon class="selected">check</mat-icon>
            }
          </span>
          <span class="track-subtitle">{{ trackSubtitles[item] }}</span>
        </span>
      </button>
    }
  </mat-menu>

  <nav class="nav">
    <a mat-button routerLink="/decks" routerLinkActive="active">Колоды</a>
    <a mat-button routerLink="/code" routerLinkActive="active">Задачи</a>
    <a mat-button routerLink="/stats" routerLinkActive="active">Прогресс</a>
  </nav>

  <span class="spacer"></span>

  <button
    mat-icon-button
    type="button"
    (click)="toggleTheme()"
    [attr.aria-label]="'Тема: ' + themeLabel()"
    [title]="'Тема: ' + themeLabel()"
  >
    <mat-icon>{{ themeIcon() }}</mat-icon>
  </button>
</mat-toolbar>

@if (content.error(); as error) {
  <div class="content-error" role="alert">Не удалось загрузить корпус вопросов: {{ error }}</div>
}

<main class="page">
  <router-outlet />
</main>
