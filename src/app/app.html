<mat-toolbar class="topbar">
  <a routerLink="/decks" class="brand">
    <span class="material-symbols-outlined">school</span>
    <span class="brand-text">Interview&nbsp;Trainer</span>
  </a>

  <nav class="nav">
    <a mat-button routerLink="/decks" routerLinkActive="active">Колоды</a>
    <a mat-button routerLink="/code" routerLinkActive="active">Задачи</a>
    <a mat-button routerLink="/stats" routerLinkActive="active">Прогресс</a>
  </nav>

  <span class="spacer"></span>

  <button
    mat-icon-button
    type="button"
    (click)="toggleTheme()"
    [attr.aria-label]="'Тема: ' + themeLabel()"
    [title]="'Тема: ' + themeLabel()"
  >
    <span class="material-symbols-outlined">{{ themeIcon() }}</span>
  </button>
</mat-toolbar>

@if (content.error(); as error) {
  <div class="content-error" role="alert">Не удалось загрузить корпус вопросов: {{ error }}</div>
}

<main class="page">
  <router-outlet />
</main>
